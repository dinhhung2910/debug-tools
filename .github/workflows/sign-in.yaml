name: Get credentials

on:
  workflow_call:
    inputs:
      ENV:
        required: true
        type: string
    secrets:
      SSH_UPSTREAM_HOST:
        required: true
      SSH_UPSTREAM_PORT:
        required: true
      SSH_UPSTREAM_USER:
        required: true
      SSH_UPSTREAM_SECRET_KEY:
        required: true
      SSH_UPSTREAM_FILE_PATH:
        required: true
      REGISTRY_ENDPOINT:
        required: true
jobs:
  get-credentials:
    runs-on: linux-amd64
    environment: ${{ inputs.ENV }}
    steps:
      - name: Write secret key
        run: |
            cat<<EOF>ssh_key
            ${SECRET_KEY}
            EOF
            chmod 400 ssh_key
        shell: bash
        env:
          SECRET_KEY: ${{secrets.SSH_UPSTREAM_SECRET_KEY}}

      - name: Get credentials file
        id: get-credentials
        run: |
            scp -o StrictHostKeyChecking=no -i ssh_key -P ${PORT} \
              ${USER}@${HOST}:${FILE_PATH} credentials
            source credentials
            echo "::set-output name=AWS_ACCESS_KEY_ID::$AWS_ACCESS_KEY_ID"
            echo "::set-output name=AWS_SECRET_ACCESS_KEY::$AWS_SECRET_ACCESS_KEY"
            echo "::set-output name=AWS_SESSION_TOKEN::$AWS_SESSION_TOKEN"
            echo "::set-output name=AWS_REGION::$AWS_REGION"
        shell: bash
        env:
          PORT: ${{secrets.SSH_UPSTREAM_PORT}}
          USER: ${{secrets.SSH_UPSTREAM_USER}}
          HOST: ${{secrets.SSH_UPSTREAM_HOST}}
          FILE_PATH: ${{secrets.SSH_UPSTREAM_FILE_PATH}}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ steps.get-credentials.outputs.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ steps.get-credentials.outputs.AWS_SECRET_KEY }}
          aws-session-token: '${{ steps.get-credentials.outputs.AWS_SESSION_TOKEN }}'
          aws-region: ${{ steps.get-credentials.outputs.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_ENDPOINT }}