name: Debug tools DEV

on:
  push:
    branches:
      - 'develop'
    tags-ignore:
      - '*'

jobs:
  cleanup:
    uses: ./.github/workflows/clean-up.yaml

  sign-in:
    uses: ./.github/workflows/sign-in.yaml
    with:
      ENV: dev
    secrets:
      SSH_UPSTREAM_HOST: ${{ secrets.SSH_UPSTREAM_HOST }}
      SSH_UPSTREAM_PORT: ${{ secrets.SSH_UPSTREAM_PORT }}
      SSH_UPSTREAM_USER: ${{ secrets.SSH_UPSTREAM_USER }}
      SSH_UPSTREAM_SECRET_KEY: ${{ secrets.SSH_UPSTREAM_SECRET_KEY }}
      SSH_UPSTREAM_FILE_PATH: ${{ secrets.SSH_UPSTREAM_FILE_PATH }}
      REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT }}